# ===================================================================
# MLRIT Unified College Portal - Render Blueprint Deployment
# Deploys Spring Boot Backend (Docker) + React Frontend (Static Site)
# ===================================================================
services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: mlrit-portal-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080

  # 2. React Vite Frontend Static Site
  - type: web
    name: mlrit-portal-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mlrit-portal-backend
          property: url
